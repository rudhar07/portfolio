<!doctype html>
<html lang="en" data-side="red">
  <head>
    <meta charset="UTF-8" />

    <link rel="canonical" href="https://rudharbajaj.vercel.app/" />
    <meta name="theme-color" content="#0a0a0a" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rudharbajaj.vercel.app/" />
    <meta property="og:title" content="Rudhar Bajaj, RL Environments &amp; Full-Stack Engineer" />
    <meta property="og:description" content="I build the environments coding agents are trained and graded in. State-level table tennis player." />
    <meta property="og:image" content="https://rudharbajaj.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rudhar Bajaj, RL Environments &amp; Full-Stack Engineer" />
    <meta name="twitter:description" content="I build the environments coding agents are trained and graded in. State-level table tennis player." />
    <meta name="twitter:image" content="https://rudharbajaj.vercel.app/og.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load without blocking first paint; the system fallbacks are close enough to swap from -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      />
    </noscript>

    <script>
      // Before first paint: pick the side from the URL so a shared ?side=black link never flashes red.
      ;(function () {
        var d = document.documentElement
        d.classList.add('js')
        try {
          var q = new URLSearchParams(location.search)
          if (q.get('side') === 'black') d.dataset.side = 'black'
          // the serve intro: once per visit, never under reduced motion; ?intro replays it
          var still = matchMedia('(prefers-reduced-motion: reduce)').matches
          var seen = sessionStorage.getItem('served') || navigator.webdriver
          if (!still && (!seen || q.has('intro'))) {
            d.classList.add('intro')
            sessionStorage.setItem('served', '1')
          }
        } catch (e) {}
      })()
    </script>
    <style>
      /*
       * The serve intro, first visit only. Pure CSS so it never waits on the app bundle: the ball
       * is tossed (the counter climbs to 16 cm, the legal minimum), the paddle strikes, the ball
       * leaves, and the curtain wipes up. It hides itself even if no script ever runs again.
       */
      #intro {
        display: none;
      }
      @property --toss {
        syntax: '<integer>';
        inherits: false;
        initial-value: 0;
      }
      html.intro #intro {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #f4f1ea;
        animation: intro-wipe 0.4s cubic-bezier(0.7, 0, 0.2, 1) 1s forwards;
      }
      html.intro[data-side='black'] #intro {
        background: #eeeae1;
        color: #0b0b0b;
      }
      html.intro-skip #intro {
        pointer-events: none;
        animation: intro-wipe 0.3s cubic-bezier(0.7, 0, 0.2, 1) forwards;
      }
      .intro-inner {
        display: grid;
        justify-items: center;
        gap: 18px;
        font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
        font-size: 12px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        animation: intro-fade 0.2s ease 0.8s forwards;
      }
      .intro-court {
        position: relative;
        width: 200px;
        height: 230px;
      }
      .intro-ball {
        position: absolute;
        left: 112px;
        bottom: 46px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff, #f2efe8 45%, #c9c4b8);
        box-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
        animation: intro-toss 1.02s linear forwards;
      }
      html[data-side='black'] .intro-ball {
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
      }
      .intro-paddle {
        position: absolute;
        left: 40px;
        bottom: 0;
        width: 74px;
        height: 118px;
        transform-origin: 50% 100%;
        transform: rotate(-55deg);
        animation: intro-swing 1s linear forwards;
      }
      .intro-paddle::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 74px;
        height: 78px;
        border-radius: 50% 50% 46% 46%;
        background: #d7263d;
      }
      .intro-paddle::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 29px;
        width: 16px;
        height: 44px;
        border-radius: 3px;
        background: #7a4a2a;
      }
      .intro-count {
        counter-reset: toss var(--toss);
        font-family: 'Bebas Neue', Impact, sans-serif;
        font-size: 64px;
        line-height: 1;
        letter-spacing: 0.02em;
        animation: intro-count 0.55s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      }
      .intro-count::before {
        content: counter(toss, decimal-leading-zero);
      }
      .intro-count span {
        font-size: 22px;
        margin-left: 6px;
      }
      @keyframes intro-count {
        to {
          --toss: 16;
        }
      }
      @keyframes intro-toss {
        0% {
          transform: translate(0, 0);
          animation-timing-function: cubic-bezier(0.2, 0.6, 0.35, 1);
        }
        54% {
          transform: translate(0, -150px);
          animation-timing-function: cubic-bezier(0.55, 0, 0.8, 0.4);
        }
        78% {
          transform: translate(0, -48px);
          animation-timing-function: cubic-bezier(0.1, 0.6, 0.3, 1);
        }
        100% {
          transform: translate(70vw, -80vh);
        }
      }
      @keyframes intro-swing {
        0%,
        68% {
          transform: rotate(-55deg);
          animation-timing-function: cubic-bezier(0.5, 0, 0.9, 0.5);
        }
        80% {
          transform: rotate(22deg);
          animation-timing-function: ease-out;
        }
        100% {
          transform: rotate(34deg);
        }
      }
      @keyframes intro-fade {
        to {
          opacity: 0;
        }
      }
      @keyframes intro-wipe {
        from {
          clip-path: inset(0 0 0 0);
        }
        to {
          clip-path: inset(0 0 100% 0);
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <div class="intro-inner">
        <span>Rudhar Bajaj</span>
        <div class="intro-court">
          <span class="intro-paddle"></span>
          <span class="intro-ball"></span>
        </div>
        <span class="intro-count"><span>cm</span></span>
        <span>Toss. Serve.</span>
      </div>
    </div>
    <script>
      // any click, key, wheel or touch skips the intro; it is removed as soon as it has wiped away
      ;(function () {
        var d = document.documentElement
        var el = document.getElementById('intro')
        if (!d.classList.contains('intro')) return el.remove()
        var kinds = ['pointerdown', 'keydown', 'wheel', 'touchstart']
        var skip = function () {
          d.classList.add('intro-skip')
        }
        var done = function () {
          kinds.forEach(function (k) {
            removeEventListener(k, skip)
          })
          d.classList.remove('intro', 'intro-skip')
          el.remove()
        }
        kinds.forEach(function (k) {
          addEventListener(k, skip, { passive: true })
        })
        el.addEventListener('animationend', function (e) {
          if (e.animationName === 'intro-wipe') done()
        })
        setTimeout(done, 3000)
      })()
    </script>
    <div id="root"><!--app-html--></div>
    <!--app-state-->
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
